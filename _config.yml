title: G. Dato
# The version of the site, shown in the menu bar and in the status bar at the bottom.
# Raise it with every change you publish: the last number for fixes, the middle one for new things, the first for a new look.
version: "1.2.0"
description: Small Android apps by G. Dato, made in Switzerland. No ads, no tracking.
lang: en
url: "https://gdato.github.io"
plugins:
  - jekyll-relative-links
relative_links:
  enabled: true
defaults:
  - scope:
      path: ""
    values:
      layout: default
exclude:
  - README.md
  - NOTICE.md
